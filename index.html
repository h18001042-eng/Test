<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عداد رموز الشدة</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f0f2f5;
            margin: 0;
        }

        .container {
            background-color: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background-color: #ffffff;
            border: 2px solid #e1e4e8;
            border-radius: 15px;
            padding: 30px 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none; /* لمنع تحديد النص عند النقر السريع */
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 15px rgba(0,0,0,0.1);
        }

        .card:active {
            transform: scale(0.95);
        }

        .suit {
            font-size: 60px;
            line-height: 1;
            margin-bottom: 15px;
        }

        .red { color: #e74c3c; }
        .black { color: #2c3e50; }

        .counter {
            font-size: 32px;
            font-weight: bold;
            color: #333;
        }

        .reset-btn {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 15px 0;
            width: 100%;
            font-size: 18px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .reset-btn:hover {
            background-color: #2980b9;
        }

        .reset-btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="grid">
            <!-- الكبة (Hearts) -->
            <div class="card" onclick="increment('hearts')">
                <div class="suit red">♥</div>
                <div class="counter" id="hearts-count">0</div>
            </div>
            
            <!-- البستوني (Spades) -->
            <div class="card" onclick="increment('spades')">
                <div class="suit black">♠</div>
                <div class="counter" id="spades-count">0</div>
            </div>
            
            <!-- الديناري (Diamonds) -->
            <div class="card" onclick="increment('diamonds')">
                <div class="suit red">♦</div>
                <div class="counter" id="diamonds-count">0</div>
            </div>
            
            <!-- السباتي (Clubs) -->
            <div class="card" onclick="increment('clubs')">
                <div class="suit black">♣</div>
                <div class="counter" id="clubs-count">0</div>
            </div>
        </div>

        <!-- زر التصفير -->
        <button class="reset-btn" onclick="resetAll()">🔄 تصفير العدادات</button>
    </div>

    <script>
        // دالة لزيادة العداد للخانة المحددة
        function increment(suitId) {
            const countElement = document.getElementById(suitId + '-count');
            let currentCount = parseInt(countElement.innerText);
            countElement.innerText = currentCount + 1;
        }

        // دالة لتصفير جميع العدادات
        function resetAll() {
            document.getElementById('hearts-count').innerText = '0';
            document.getElementById('spades-count').innerText = '0';
            document.getElementById('diamonds-count').innerText = '0';
            document.getElementById('clubs-count').innerText = '0';
        }
    </script>

</body>
</html>
